<div class="record-status"><div class="eyebrow">AERIAL EXAMINATION · SOURCE REGISTER</div><h3>Location context is not a surveyed wreckage field</h3><p>The post-impact view uses georeferenced satellite imagery and the preliminary NTSB accident location. The rendered fire, fragments, smoke, and ground mark are explanatory illustrations—not mapped observations or a measured crater.</p><p>The uploaded social clips contain computer-generated impact and crater illustrations; those frames are visual references, not independent measurements. A separate witness dashcam excerpt is linked below with the publisher's attribution.</p><div class="emergency-links"><a class="btn" target="_blank" rel="noopener" href="https://www.foxnews.com/video/6407759711112">WITNESS DASHCAM · 0:41</a><a class="btn" target="_blank" rel="noopener" href="https://www.youtube.com/live/9utTZTQbKz8">OFFICIAL NTSB BRIEFING</a><a class="btn" target="_blank" rel="noopener" href="https://www.ntsb.gov/investigations/Pages/ERA27MA026.aspx">GOVERNMENT INVESTIGATION</a></div><p class="foot">Dashcam publisher credit: Aki Kuusisto via Storyful. Source links are not embedded or redistributed footage. No authenticated complete 911 audio accompanies this reconstruction.</p></div><div class="sourcegrid"><div><p><b>Recorded:</b> sampled latitude, longitude, pressure altitude, groundspeed and ground track. Full-flight data comes from Flightradar24’s public standard CSV; the final segment uses its granular CSV with independently updating fields.</p><p><b>Not recorded here:</b> bank, aircraft pitch, angle of attack, control inputs, airspeed, load factor or exact impact. Model attitude follows the path for display only. Pressure altitude is not geometric altitude above terrain; low-altitude rendering is ground-clamped to avoid putting the model underground.</p><p><b>Weather:</b> IEM NEXRAD base-reflectivity mosaics use the actual flight UTC clock, selecting the preceding five-minute archive. Displayed timestamps are nominal mosaic times; component scans can be older. This is precipitation-echo context, not exact cloud geometry, cockpit visibility, icing or turbulence. Failed or loading frames are labeled; current weather is never substituted.</p><p><b>Reported weather:</b> The NTSB November 2 briefing relayed the crew’s reports around 17:47 UTC of moderate turbulence, light clear ice described as manageable, and −47°C outside temperature. These are crew reports, not independently reconstructed conditions.</p><p><b>Data boundary:</b> Flightradar24’s published last received altitude is 8,750 ft. This dataset’s last changing pressure-altitude field is at 17:49:22.955 UTC; later published positions through 17:49:31.540 constrain the horizontal display only. From film second 20, altitude, attitude, impact timing and breakup are illustrative—not additional measured data. Other tracking products can have differently timed barometric and geometric fields; this is not a claim that all public observations stop at 8,750 ft. A repeated field is not proof of a level-off.</p><p><b>Aircraft:</b> original approximate Learjet 60 exterior and representative Pro Line 4 pilot-view overlay. Not a measured replica of this airframe, a 60XR cockpit, or a training simulator.</p><p><b>Voice:</b> educational device-generated speech, with selectable installed English voices and adjustable pacing. It is not a recorded human voiceover or a recreation of the pilots. Natural recorded speech generation was unavailable for this revision. Radio is a third-party FAA-attributed excerpt, not a verified complete FAA or 911 release.</p></div><div><ul><li><a target="_blank" rel="noopener" href="https://www.ntsb.gov/investigations/Pages/ERA27MA026.aspx">NTSB investigation ERA27MA026</a></li><li><a target="_blank" rel="noopener" href="https://www.flightradar24.com/blog/flight-tracking-news/major-incident/learjet-60-crashes-near-west-palm-beach-florida/">Flightradar24 public flight data</a></li><li><a target="_blank" rel="noop
