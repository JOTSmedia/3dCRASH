factor and flight control</a></li><li><a target="_blank" rel="noopener" href="https://terrain.reearth.land/">Re:Earth terrain</a></li></ul><p>The investigation remains open. No cause is assigned by this app. Background imagery is not accident-day weather.</p><p>Keyless globe: CesiumJS + NASA GIBS + Re:Earth terrain. <b>No Google Earth imagery or Google credentials are used.</b> Terrain and external assets need internet; the track and analytic fallback are bundled.</p><div class="row"><button id="nasa">NASA EARTH</button><button id="satellite">SATELLITE</button><button id="export">EXPORT TRACK CSV</button><button id="model">EXPORT JET GLB</button></div><p class="foot">Optional satellite: Powered by Esri · Esri, Vantor, Earthstar Geographics and GIS User Community. Retain attribution. Re:Earth / Mapterhorn CC BY 4.0. NASA Blue Marble is a static composite, not live imagery.</p></div></div></section>
